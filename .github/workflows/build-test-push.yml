name: build, test, push

# Builds each container variant, runs the GPU-less test suite against it, and
# only then pushes to GHCR. A container that fails its tests is never tagged.

on:
  push:
    branches: [main]
    paths:
      - 'Singularity*'
      # rt-run is installed into every image.
      - 'src/**'
      - 'pyproject.toml'
      - 'tests/**'
      # Need no image; rt-run.yml runs them in a minute.
      - '!tests/test_rt_run.py'
      - '!tests/rt_run_fakes.py'
      - '!tests/test_recipes.py'
      - '.github/workflows/build-test-push.yml'
  pull_request:
    paths:
      - 'Singularity*'
      - 'src/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '!tests/test_rt_run.py'
      - '!tests/rt_run_fakes.py'
      - '!tests/test_recipes.py'
  schedule:
    # Weekly rebuild, so upstream breakage surfaces on a Monday rather than
    # the morning someone needs the container.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Deliberately not a dependency of `build`: a formatting nit should not stand
  # between a recipe change and a five hour container build. It runs alongside
  # them and still turns the workflow red on its own.
  lint:
    name: lint tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned: an unrelated pylint release adding a new check should not turn
      # this red on a day nobody touched the suite. Bump deliberately.
      - name: Install linters
        run: |
          pip install --no-cache-dir \
            black==26.5.1 \
            flake8==7.3.0 \
            pylint==4.0.8 \
            numpy \
            pytest \
            .

      # Each tool reads its own config from tests/ -- no flags here, so what
      # CI enforces is exactly what runs locally.
      - name: black
        run: black --check --diff tests/

      - name: flake8
        working-directory: tests
        run: flake8 .

      - name: pylint
        working-directory: tests
        run: pylint *.py

      # The runner ships its own shellcheck, but the version drifts with the
      # image. Pin it for the same reason the Python linters are pinned.
      - name: Install shellcheck
        run: |
          curl -fsSL \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.10.0/shellcheck
          shellcheck --version

      - name: shellcheck
        working-directory: tests
        run: shellcheck *.sh

  build:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    # The full CUDA build compiles PRESTO, heimdall, dedisp and psrdada from
    # source; give it room before the 6 hour ceiling.
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      # For cosign's keyless signing: GitHub's word that this is this
      # workflow, running on main.
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            tag: cpu
            recipe: Singularity.cpu
            runner: ubuntu-24.04
          # The two GPU recipes take CUDA_VERSION as a build arg. Each is built
          # twice: once on the 11.8 default, which is what the published tags
          # have always been, and once on 12.6 for sites on a CUDA 12 driver
          # branch. The recipe picks its tensorflow to match.
          - variant: gpu
            tag: gpu
            recipe: Singularity.gpu
            runner: ubuntu-24.04
          - variant: gpu
            tag: gpu-cuda12.6
            cuda: 12.6.3
            recipe: Singularity.gpu
            runner: ubuntu-24.04
          - variant: latest
            tag: latest
            recipe: Singularity
            runner: ubuntu-24.04
          - variant: latest
            tag: latest-cuda12.6
            cuda: 12.6.3
            recipe: Singularity
            runner: ubuntu-24.04
          # Singularity.arm now bootstraps from arm64v8/ubuntu, which matches
          # the Graviton runner's own architecture, so it builds natively --
          # no qemu, and no emulation penalty.
          - variant: arm
            tag: arm
            recipe: Singularity.arm
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # A CUDA devel base plus conda plus PRESTO will not fit in the ~14 GB
      # a stock runner leaves free. This reclaims roughly 30 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # eWaterCycle/setup-apptainer always fetches apptainer's amd64 .deb --
      # apptainer publishes no arm64 packages at all -- so it can't work on
      # the Graviton runner. Use it on x86_64 and build from source on arm64.
      - name: Install Apptainer
        if: matrix.runner != 'ubuntu-24.04-arm'
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Install Apptainer build dependencies (arm64)
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libseccomp-dev pkg-config \
            uidmap squashfs-tools fakeroot cryptsetup tzdata git

      - name: Set up Go (arm64)
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Apptainer from source (arm64)
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          git clone --depth 1 --branch v1.3.6 https://github.com/apptainer/apptainer.git /tmp/apptainer-src
          cd /tmp/apptainer-src
          ./mconfig
          make -C builddir -j"$(nproc)"
          sudo make -C builddir install
          apptainer --version

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, so
      # `--fakeroot` is unreliable on these runners. sudo always works, and
      # the runner is disposable anyway.
      - name: Build ${{ matrix.recipe }}
        env:
          CUDA_VERSION: ${{ matrix.cuda }}
        run: |
          # Empty for the non-CUDA recipes and for the default 11.8 builds,
          # which take the value from the recipe's own %arguments block.
          args=()
          [ -n "$CUDA_VERSION" ] && args+=(--build-arg "CUDA_VERSION=$CUDA_VERSION")
          sudo apptainer build "${args[@]}" \
            radio_transients_${{ matrix.tag }}.sif \
            ${{ matrix.recipe }}
          sudo chown "$USER" radio_transients_${{ matrix.tag }}.sif

      - name: Report image size
        run: ls -lh radio_transients_${{ matrix.tag }}.sif

      # The runner has no GPU, which is exactly what the suite is written for.
      - name: Test
        run: |
          apptainer exec \
            --bind "$PWD/tests:/tests" \
            radio_transients_${{ matrix.tag }}.sif \
            bash /tests/container_test.sh \
              --variant ${{ matrix.variant == 'latest' && 'full' || matrix.variant }} \
            | tee test-results-${{ matrix.tag }}.tap

      # The ways to run the image from outside it. `run IMAGE CMD` must pass
      # CMD its arguments. rt-run must install from the image alone, with the
      # `install` app; must install from the host, reading the variant from
      # the image's RT_TAG label; and must bind-mount a directory outside
      # $HOME, /tmp and $PWD, which only it makes visible.
      - name: Test runscript and rt-run
        env:
          SIF: radio_transients_${{ matrix.tag }}.sif
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ matrix.tag }}
          RT_HOME: ${{ runner.temp }}/rt
        run: |
          set -x
          # One Version label, rt-run's, and a build date; the recipe writes
          # both, so the four images cannot disagree.
          version=$(apptainer exec "$SIF" /usr/local/miniconda/envs/RT/bin/rt-run --version | cut -d' ' -f2)
          apptainer inspect "$SIF" | grep -qxF "Version: v$version"
          apptainer inspect "$SIF" | grep -qE '^Build-date: [0-9]{2}-[A-Z][a-z]{2}-[0-9]{4}$'
          prefix=$(apptainer run "$SIF" python -c 'import sys; print(sys.prefix)')
          [ "$prefix" = /usr/local/miniconda/envs/RT ]
          if [ "$VARIANT" = latest ]; then
            # The full image's default is your_heimdall.py, options and all.
            apptainer run "$SIF" --help | grep -q your_heimdall
          else
            # With no command, the others open a shell.
            env=$(echo 'echo "$CONDA_DEFAULT_ENV"' | apptainer run "$SIF")
            [ "$env" = RT ]
          fi

          apptainer run --app install "$SIF"
          [ "$(cat "$RT_HOME/tag")" = "$TAG" ]
          "$RT_HOME/bin/rt-run" list
          "$RT_HOME/bin/rt-run" uninstall

          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir .
          "$RUNNER_TEMP/venv/bin/rt-run" install --from "$SIF"
          [ "$(cat "$RT_HOME/tag")" = "$TAG" ]
          sudo mkdir /rt-data
          sudo chown "$USER" /rt-data
          "$RT_HOME/bin/rt-run" python tests/make_filterbank.py /rt-data/x.fil
          "$RT_HOME/bin/your_header.py" -f /rt-data/x.fil

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-${{ matrix.tag }}
          path: test-results-${{ matrix.tag }}.tap

      # Only reached when the tests passed, and only from main: never on a
      # pull request, and never from "Run workflow" on another branch, which
      # would put an untested branch's images over the published tags.
      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://${{ env.REGISTRY }}
          apptainer push radio_transients_${{ matrix.tag }}.sif \
            oras://${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.tag }}

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # Keyless: the signature carries GitHub's word that build-test-push.yml
      # on main made it, and there is no key to keep. rt-run checks it before
      # pulling; `cosign verify` does by hand (see the README). GHCR has no
      # referrers API, so cosign keeps it under the tag sha256-<digest>.
      - name: Sign the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SIF: radio_transients_${{ matrix.tag }}.sif
          TAG: ${{ matrix.tag }}
          REPO: ${{ github.repository }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # apptainer push doesn't print the digest it pushed, so ask GHCR --
          # and sign it only if its one layer is this file, not whatever
          # another run may have pushed to the tag since.
          token=$(curl -fsS -u "$ACTOR:$GITHUB_TOKEN" \
            "https://ghcr.io/token?scope=repository:$REPO:pull" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          curl -fsS -D headers -o manifest.json \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$REPO/manifests/$TAG"
          digest=$(tr -d '\r' < headers | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}')
          layer=$(python3 -c 'import json; print(json.load(open("manifest.json"))["layers"][0]["digest"])')
          echo "$TAG is $digest; its layer is $layer"
          [ "$layer" = "sha256:$(sha256sum "$SIF" | cut -d' ' -f1)" ]

          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "$IMAGE@$digest"
          # What rt-run will ask: signed by this workflow, on main.
          cosign verify \
            --certificate-identity "https://github.com/$REPO/.github/workflows/build-test-push.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$digest" > /dev/null
